name: Feature Request
description: Suggest an idea or enhancement for ScreenRuler Pro
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the information below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm frustrated when...
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: I would like to see...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered
      placeholder: Alternative approaches...
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Do you have examples from other applications?
      placeholder: Similar to how [app] does [feature]...
    validations:
      required: false

  - type: checkboxes
    id: impact
    attributes:
      label: Feature Impact
      description: What areas would this feature affect?
      options:
        - label: User Interface
        - label: Measurement Accuracy
        - label: Performance
        - label: New Measurement Mode
        - label: Keyboard Shortcuts
        - label: Configuration/Settings
        - label: Visual Appearance

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request
      placeholder: Any other relevant information
